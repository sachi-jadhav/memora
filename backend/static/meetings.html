<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>All Meetings | Memora</title>

  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f7fb; display: flex; height: 100vh; }

    .sidebar {
      width: 240px;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: white;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
    }

    .nav a {
      display: block;
      padding: 12px 16px;
      border-radius: 10px;
      color: #cbd5f5;
      text-decoration: none;
      margin-bottom: 8px;
    }

    .nav a.active, .nav a:hover {
      background: #2563eb;
      color: #fff;
    }

    .main { flex: 1; padding: 32px; overflow-y: auto; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }

    .done { text-decoration: line-through; color: #9ca3af; }
  </style>
</head>

<body>

<aside class="sidebar">
  <nav class="nav">
    <a href="/">Dashboard</a>
    <a href="/recording">New Recording</a>
    <a href="/meetings" class="active">All Meetings</a>
  </nav>
</aside>

<main class="main">
  <h1>All Meetings</h1>
  <div id="meetingsContainer" class="grid"></div>
</main>

<script>
fetch("/api/meetings")
  .then(r => r.json())
  .then(meetings => {
    const box = document.getElementById("meetingsContainer");
    meetings.forEach(m => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h3 onclick="location.href='/meeting/${m.id}'" style="cursor:pointer;">
          ${m.title}
        </h3>

        <p contenteditable="true"
           onblur="updateMeeting(${m.id}, 'summary', this.innerText)">
          ${m.summary}
        </p>

        <ul>
          ${m.actions.map((a,i)=>`
            <li onclick="toggleAction(${m.id},${i},this)"
                class="${a.startsWith('[x]') ? 'done' : ''}">
              ${a}
            </li>`).join("")}
        </ul>

        <button onclick="deleteMeeting(${m.id})"
                style="background:#ef4444;color:white;border:none;
                       padding:8px 12px;border-radius:8px;">
          Delete
        </button>
      `;
      box.appendChild(card);
    });
  });

function updateMeeting(id, field, value) {
  fetch("/api/meetings/update", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id, field, value })
  });
}

function toggleAction(id, index, el) {
  let text = el.innerText.startsWith("[x]")
    ? el.innerText.replace("[x] ", "")
    : "[x] " + el.innerText;

  el.innerText = text;
  el.classList.toggle("done");

  fetch("/api/meetings/update-action", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id, index, value:text })
  });
}

function deleteMeeting(id) {
  if (!confirm("Delete meeting?")) return;
  fetch("/api/meetings/delete", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id })
  }).then(()=>location.reload());
}
</script>

</body>
</html>
