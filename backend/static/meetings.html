<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>All Meetings | MoM</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
      display: flex;
      height: 100vh;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: 240px;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: #fff;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 32px;
    }

    .nav a {
      display: block;
      padding: 12px 16px;
      border-radius: 10px;
      color: #cbd5f5;
      text-decoration: none;
      margin-bottom: 8px;
    }

    .nav a.active,
    .nav a:hover {
      background: #2563eb;
      color: #fff;
    }

    .privacy {
      margin-top: auto;
      font-size: 13px;
      color: #9ca3af;
    }

    /* ---------- MAIN ---------- */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      height: 100%;
    }

    /* ---------- LIST ---------- */
    .list {
      background: #fff;
      border-right: 1px solid #e5e7eb;
      overflow-y: auto;
      padding: 20px;
    }

    .meeting-item {
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 10px;
      background: #f9fafb;
    }

    .meeting-item:hover {
      background: #e0e7ff;
    }

    .meeting-title {
      font-weight: 600;
    }

    .meeting-meta {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    /* ---------- DETAILS ---------- */
    .details {
      padding: 28px;
      overflow-y: auto;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-left: 12px;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">Memora</div>

    <nav class="nav">
      <a href="/dashboard">Dashboard</a>
      <a href="/recording">New Recording</a>
      <a href="/meetings" class="active">All Meetings</a>
    </nav>

    <div class="privacy">
      ● 100% Private<br/>
      Data stored locally
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- LEFT: MEETING LIST -->
    <section class="list" id="meetingList"></section>

    <!-- RIGHT: DETAILS -->
    <section class="details" id="meetingDetails">
      <h2>Select a meeting</h2>
    </section>

  </main>
<script>
  if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "/";
  }
</script>

<script>
const listEl = document.getElementById("meetingList");
const detailsEl = document.getElementById("meetingDetails");

fetch("/api/meetings")
  .then(res => res.json())
  .then(renderMeetings);

function renderMeetings(meetings) {
  listEl.innerHTML = "";
  meetings.forEach(m => {
    const div = document.createElement("div");
    div.className = "meeting-item";
    div.innerHTML = `
      <div class="meeting-title">${m.title}</div>
      <div class="meeting-meta">${m.date} · ${m.duration}</div>
    `;
    div.onclick = () => selectMeeting(m);
    listEl.appendChild(div);
  });
}

function selectMeeting(m) {
  detailsEl.innerHTML = `
    <h2>
      ${m.title}
      <button class="delete-btn" onclick="deleteMeeting(${m.id})">
        Delete
      </button>
    </h2>

    <div class="card">
      <h3>Summary</h3>
      <p>${m.summary}</p>
    </div>

    <div class="card">
      <h3>Action Items</h3>
      <ul>${m.actions.map(a => `<li>${a}</li>`).join("")}</ul>
    </div>

    <div class="card">
      <h3>Transcript</h3>
      <p>${m.transcript}</p>
    </div>
  `;
}

function deleteMeeting(id) {
  if (!confirm("Are you sure you want to delete this meeting?")) return;

  fetch(`/api/meetings/${id}`, { method: "DELETE" })
    .then(() => location.reload());
}
</script>

</body>
</html>
