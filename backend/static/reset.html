<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password | Meetily</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      color: #1f2937;
    }

    .reset-container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
    }

    .info {
      background: #eff6ff;
      color: #1e40af;
      font-size: 13px;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 20px;
      text-align: left;
    }

    .field label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }

    .reset-btn {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .links {
      margin-top: 20px;
      font-size: 14px;
    }

    .links a {
      color: #2563eb;
      text-decoration: none;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="reset-container">
    <div class="logo">Meetily</div>
    <div class="subtitle">Reset your password</div>

    <div class="info">
      Enter your email address and we’ll send you a reset link.
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>

    <button class="reset-btn" onclick="sendReset()">Send Reset Link</button>

    <div class="links">
      <a href="/login">Back to Sign In</a>
    </div>
  </div>

  <!-- 🔐 If already logged in, block reset -->
  <script>
    if (localStorage.getItem("loggedIn") === "true") {
      window.location.replace("/dashboard");
    }
  </script>

  <script>
    function sendReset() {
      const email = document.getElementById("email").value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailRegex.test(email)) {
        alert("Please enter a valid email address");
        return;
      }

      // 🔐 Simulated reset success
      alert("Password reset link sent to " + email);

      window.location.replace("/login");
    }
  </script>

</body>
</html>
