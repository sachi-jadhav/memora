<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | Memora</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      color: #1f2937;
    }

    .login-container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }

    .login-btn {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .divider {
      text-align: center;
      margin: 24px 0;
      font-size: 13px;
      color: #9ca3af;
    }

    .google-btn {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d1d5db;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google-btn img {
      width: 18px;
      height: 18px;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .links a {
      color: #2563eb;
      text-decoration: none;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="logo">Memora</div>
    <div class="subtitle">Sign in to continue</div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>

    <div class="field">
      <label>Password</label>
      <div style="position:relative;">
        <input
          type="password"
          id="password"
          placeholder="••••••••"
          style="padding-right:42px;"
        />
        <span
          onclick="togglePassword()"
          style="
            position:absolute;
            right:12px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            font-size:14px;
            color:#6b7280;
          "
          id="toggleIcon"
        >
          👁️
        </span>
      </div>
    </div>

    <button class="login-btn" onclick="login()">Login</button>

    <div class="divider">or</div>

    <button class="google-btn" onclick="googleLogin()">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" />
      Continue with Google
    </button>

    <div class="links">
      <a href="/reset">Forgot password?</a>
      <a href="/signup">Create a new account</a>
    </div>
  </div>

  <!-- 🔐 Prevent login page if already logged in -->
  <script>
    if (localStorage.getItem("loggedIn") === "true") {
      window.location.replace("/dashboard");
    }
  </script>

  <script>
    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailRegex.test(email)) {
        alert("Please enter a valid email address");
        return;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters");
        return;
      }

      fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      })
      .then(res => {
        if (!res.ok) throw new Error();
        return res.json();
      })
      .then(() => {
        localStorage.setItem("loggedIn", "true");
        window.location.replace("/dashboard");
      })
      .catch(() => {
        alert("Invalid credentials");
      });
    }

    function googleLogin() {
      // simulated Google OAuth
      localStorage.setItem("loggedIn", "true");
      window.location.replace("/dashboard");
    }

    function togglePassword() {
      const pwd = document.getElementById("password");
      const icon = document.getElementById("toggleIcon");

      if (pwd.type === "password") {
        pwd.type = "text";
        icon.textContent = "🙈";
      } else {
        pwd.type = "password";
        icon.textContent = "👁️";
      }
    }
  </script>

</body>
</html>
