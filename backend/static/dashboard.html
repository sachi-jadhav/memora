<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | Memora</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
      display: flex;
      height: 100vh;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: 240px;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: #fff;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 32px;
    }

    .nav a {
      display: block;
      padding: 12px 16px;
      border-radius: 10px;
      color: #cbd5f5;
      text-decoration: none;
      margin-bottom: 8px;
    }

    .nav a.active,
    .nav a:hover {
      background: #2563eb;
      color: #fff;
    }

    .privacy {
      margin-top: auto;
      font-size: 13px;
      color: #9ca3af;
    }

    /* ---------- MAIN ---------- */
    .main {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 28px;
      margin: 0;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .new-recording {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    /* ---------- STATS ---------- */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }

    .stat-card h3 {
      margin: 0;
      font-size: 15px;
      color: #6b7280;
    }

    .stat-card p {
      margin-top: 10px;
      font-size: 26px;
      font-weight: 600;
    }

    .section-title {
      font-size: 20px;
      margin: 28px 0 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .meeting {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .meeting:last-child {
      border-bottom: none;
    }

    ul {
      padding-left: 18px;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">Memora</div>

    <nav class="nav">
      <a href="/dashboard" class="active">Dashboard</a>
      <a href="/recording">New Recording</a>
      <a href="/meetings">All Meetings</a>
    </nav>

    <div class="privacy">
      ● 100% Private<br />
      Data stored locally
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="header">
      <h1>Dashboard</h1>

      <div class="header-actions">
        <button class="new-recording" onclick="location.href='/recording'">
          🎤 New Recording
        </button>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats">
      <div class="stat-card">
        <h3>Total Meetings</h3>
        <p id="totalMeetings">0</p>
      </div>

      <div class="stat-card">
        <h3>Total Action Items</h3>
        <p id="totalActions">0</p>
      </div>

      <div class="stat-card">
        <h3>Latest Meeting</h3>
        <p id="latestMeeting">N/A</p>
      </div>
    </div>

    <!-- RECENT MEETINGS -->
    <h2 class="section-title">Recent Meetings</h2>
    <div class="card" id="recentMeetings"></div>

    <!-- ACTION ITEMS -->
    <h2 class="section-title">Pending Action Items</h2>
    <div class="card">
      <ul id="actionItems"></ul>
    </div>

  </main>



<script>
/* ---------- AUTH GUARD ---------- */
fetch("/api/meetings").then(res => {
  if (res.status === 401) {
    window.location.href = "/";
  }
});

/* ---------- LOGOUT ---------- */
function logout() {
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("userRole");
  window.location.href = "/";
}


/* ---------- ACTIVE NAV ---------- */
const currentPath = window.location.pathname;
document.querySelectorAll(".nav a").forEach(link => {
  if (link.getAttribute("href") === currentPath) {
    link.classList.add("active");
  }
});

/* ---------- DASHBOARD DATA ---------- */
fetch("/api/meetings")
  .then(res => res.json())
  .then(meetings => {
    document.getElementById("totalMeetings").innerText = meetings.length;

    let actions = [];
    let recentBox = document.getElementById("recentMeetings");
    recentBox.innerHTML = "";

    meetings.slice(0, 5).forEach(m => {
      const div = document.createElement("div");
      div.className = "meeting";
      div.innerHTML = `
        <div>
          <strong>${m.title}</strong><br/>
          <span style="font-size:14px;color:#6b7280">
            ${m.date} · ${m.duration}
          </span>
        </div>
      `;
      recentBox.appendChild(div);

      if (m.actions) actions.push(...m.actions);
    });

    document.getElementById("totalActions").innerText = actions.length;
    document.getElementById("latestMeeting").innerText =
      meetings[0]?.title || "N/A";

    const actionBox = document.getElementById("actionItems");
    actionBox.innerHTML = "";

    actions.slice(0, 6).forEach(a => {
      const li = document.createElement("li");
      li.innerText = a;
      actionBox.appendChild(li);
    });
  });
</script>

</body>
</html>
