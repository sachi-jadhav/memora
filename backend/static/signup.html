<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account | Memora</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      color: #1f2937;
    }

    .signup-container {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }

    .signup-btn {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .divider {
      text-align: center;
      margin: 24px 0;
      font-size: 13px;
      color: #9ca3af;
    }

    .google-btn {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d1d5db;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google-btn img {
      width: 18px;
      height: 18px;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .links a {
      color: #2563eb;
      text-decoration: none;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="signup-container">
    <div class="logo">Memora</div>
    <div class="subtitle">Create your account</div>

    <div class="field">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your name">
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Create a password">
    </div>

    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm password">
    </div>

    <button class="signup-btn" onclick="signup()">Create Account</button>

    <div class="divider">or</div>

    <button class="google-btn" onclick="googleSignup()">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" />
      Sign up with Google
    </button>

    <div class="links">
      <a href="/login">Already have an account? Sign in</a>
    </div>
  </div>

  <!-- 🔐 Prevent signup page if already logged in -->
  <script>
    if (localStorage.getItem("loggedIn") === "true") {
      window.location.replace("/dashboard");
    }
  </script>

  <script>
    function signup() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!name) {
        alert("Please enter your full name");
        return;
      }

      if (!emailRegex.test(email)) {
        alert("Please enter a valid email");
        return;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters");
        return;
      }

      if (password !== confirmPassword) {
        alert("Passwords do not match");
        return;
      }

      // 🔐 Simulated signup success
      localStorage.setItem("loggedIn", "true");

      window.location.replace("/dashboard");
    }

    function googleSignup() {
      // Simulated Google OAuth signup
      localStorage.setItem("loggedIn", "true");
      window.location.replace("/dashboard");
    }
  </script>

</body>
</html>
